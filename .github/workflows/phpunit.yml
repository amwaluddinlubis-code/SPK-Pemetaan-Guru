name: PHPUnit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: peta_asn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source overlay
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, xml, ctype, fileinfo, json, tokenizer, dom, curl, zip
          coverage: none

      - name: Create Laravel runtime
        run: composer create-project laravel/laravel runtime --prefer-dist --no-interaction

      - name: Overlay application source
        run: |
          for path in app bootstrap config database resources routes tests; do
            if [ -d "$path" ]; then mkdir -p "runtime/$path"; cp -a "$path/." "runtime/$path/"; fi
          done
          for path in artisan vite.config.js; do
            if [ -f "$path" ]; then cp -a "$path" "runtime/$path"; fi
          done
          if [ -f .env.example ]; then cp .env.example runtime/.env; fi
          cd runtime
          composer require livewire/livewire phpoffice/phpspreadsheet --no-interaction
          php artisan key:generate

      - name: Configure PHPUnit to use MySQL
        working-directory: runtime
        run: |
          sed -i 's/name="DB_CONNECTION" value="sqlite"/name="DB_CONNECTION" value="mysql"/' phpunit.xml
          sed -i 's/name="DB_DATABASE" value=":memory:"/name="DB_DATABASE" value="peta_asn_test"/' phpunit.xml
          sed -i 's/name="DB_HOST" value="127.0.0.1"/name="DB_HOST" value="127.0.0.1"/' phpunit.xml
          php -r '$p="phpunit.xml"; $s=file_get_contents($p); if (strpos($s, "DB_CONNECTION") === false) { $s=str_replace("</php>", "    <env name=\"DB_CONNECTION\" value=\"mysql\"/>\n    <env name=\"DB_HOST\" value=\"127.0.0.1\"/>\n    <env name=\"DB_PORT\" value=\"3306\"/>\n    <env name=\"DB_DATABASE\" value=\"peta_asn_test\"/>\n    <env name=\"DB_USERNAME\" value=\"root\"/>\n    <env name=\"DB_PASSWORD\" value=\"root\"/>\n  </php>", $s); file_put_contents($p, $s); }'

      - name: Run PHPUnit suite
        working-directory: runtime
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: peta_asn_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
